<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoNoGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-gray-900 px-4">
    <!-- Logo centered at the top -->
    <header class="py-6 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide drop-shadow-lg">GoNoGo</h1>
    </header>

    <!-- Centered content with dark card -->
    <main class="flex flex-1 items-center justify-center">
        <div class="bg-gray-800 shadow-xl rounded-2xl p-6 sm:p-10 max-w-xl w-full text-center">
            <p class="text-gray-200 text-base sm:text-lg leading-relaxed">
                A simple tool to validate your project idea.
                Enter your idea, and we’ll give you insights instantly powered by
                <span class="font-semibold text-pink-400">AI + n8n</span>.
            </p>

            <button onclick="window.location.href='chat.html'"
                class="mt-6 bg-gradient-to-r from-purple-500 to-pink-600 text-white px-6 sm:px-8 py-3 rounded-xl text-base sm:text-lg font-medium shadow-md hover:opacity-90 transition w-full sm:w-auto">
                🚀 Start Now
            </button>
        </div>
    </main>
</body>

</html>
